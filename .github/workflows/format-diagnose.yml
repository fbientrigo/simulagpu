name: Temporary Prettier diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier diff
        shell: bash
        run: |
          pnpm exec prettier packages/core/src/memory-access/model.ts --write
          git diff -- packages/core/src/memory-access/model.ts
