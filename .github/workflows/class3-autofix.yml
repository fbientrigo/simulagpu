name: Class 3 temporary autofix

on:
  push:
    branches: [agent/class-3]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/class-3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only known failing files
        run: pnpm exec prettier docs/curriculum/manifest.ts packages/visuals/src/LaboratorioAccesoMemoria.vue --write
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet --exit-code -- docs/curriculum/manifest.ts packages/visuals/src/LaboratorioAccesoMemoria.vue; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/curriculum/manifest.ts packages/visuals/src/LaboratorioAccesoMemoria.vue
          git commit -m 'style(class-3): apply prettier'
          git push origin HEAD:agent/class-3
