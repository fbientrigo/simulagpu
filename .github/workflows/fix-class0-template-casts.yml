name: Fix Class 0 Template Casts

on:
  push:
    branches:
      - clase0/mobile-interactive-redesign

permissions:
  contents: write

jobs:
  fix-template-casts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clase0/mobile-interactive-redesign
      - name: Remove TypeScript-only casts from external HTML template
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/visuals/src/SimuladorIsometricoGPU.template.html')
          text = path.read_text()
          replacements = {
              "alNumero($event) as ChunkFlowConfig['bytesPerChunk']": "alNumero($event)",
              "alNumero($event) as ChunkFlowConfig['threadsPerBlock']": "alNumero($event)",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one occurrence of {old!r}, found {text.count(old)}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Remove this temporary workflow
        run: rm .github/workflows/fix-class0-template-casts.yml
      - name: Commit the targeted fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/visuals/src/SimuladorIsometricoGPU.template.html
          git add .github/workflows/fix-class0-template-casts.yml
          git commit -m "fix(class-0): remove TypeScript casts from HTML template"
          git push
