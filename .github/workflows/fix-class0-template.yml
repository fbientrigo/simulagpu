name: Fix Class 0 Template

on:
  push:
    branches:
      - clase0/mobile-interactive-redesign

permissions:
  contents: write

jobs:
  fix-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clase0/mobile-interactive-redesign
      - name: Replace multiline feedback expression
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('packages/visuals/src/SimuladorIsometricoGPU.template.html')
          text = path.read_text()
          pattern = re.compile(
              r"\{\{ estadoRespuesta\(pregunta\.id, pregunta\.correctValue\) === 'correcta' \? '¡Correcto!' : 'No es\s+correcto\.' \}\}\s*\{\{ pregunta\.explanation \}\}",
              re.MULTILINE,
          )
          replacement = "{{ textoRespuesta(pregunta.id, pregunta.correctValue) }} {{ pregunta.explanation }}"
          updated, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'Expected one feedback expression, found {count}')
          path.write_text(updated)
          PY
      - name: Remove this temporary workflow
        run: rm .github/workflows/fix-class0-template.yml
      - name: Commit the targeted fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/visuals/src/SimuladorIsometricoGPU.template.html
          git add .github/workflows/fix-class0-template.yml
          git commit -m "fix(class-0): repair exercise feedback template"
          git push
