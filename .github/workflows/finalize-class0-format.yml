name: Finalize Class 0 Format

on:
  push:
    branches:
      - clase0/mobile-interactive-redesign

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clase0/mobile-interactive-redesign
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed presentation files
        run: >-
          pnpm exec prettier --write
          packages/visuals/src/SimuladorIsometricoGPU.mobile.test.ts
          packages/visuals/src/SimuladorIsometricoGPU.template.html
      - name: Verify the complete repository
        run: pnpm verify
      - name: Remove this temporary workflow
        run: rm .github/workflows/finalize-class0-format.yml
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/visuals/src/SimuladorIsometricoGPU.mobile.test.ts
          git add packages/visuals/src/SimuladorIsometricoGPU.template.html
          git add .github/workflows/finalize-class0-format.yml
          git commit -m "style(class-0): finalize simulator formatting"
          git push
