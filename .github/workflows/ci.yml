name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web — lint, types, tests, docs build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build the Anki deck
        run: pnpm anki:build

      - name: Verify the Anki deck is reproducible
        # A second run must produce byte-identical output. --check compares
        # against the file the previous step wrote instead of rewriting it.
        run: node anki/scripts/build-anki.mjs --check

      - name: Build the static site
        run: pnpm --filter @simulagpu/docs run build

      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: apps/docs/.vitepress/dist
          retention-days: 7

  native:
    name: Native — CPU-only build and CTest
    runs-on: ubuntu-latest

    # No CUDA, no GPU. `SIMULAGPU_CUDA=OFF` makes that explicit rather than
    # relying on nvcc happening to be absent from the runner image: if a future
    # image ships the toolkit, this job must still test the CPU-only path.
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Configure (CPU only)
        run: |
          cmake -S native -B native/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSIMULAGPU_CUDA=OFF

      - name: Build
        run: cmake --build native/build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir native/build --output-on-failure

      - name: Run the lesson examples
        run: |
          ./native/build/examples/vector-add/vector_add_example
          ./native/build/examples/reduction/reduction_example

  exercise-starter:
    name: Native — exercise starters fail as designed
    runs-on: ubuntu-latest

    # Each starter ships deliberately wrong code. If its tests ever pass,
    # someone committed the answers or the tests stopped checking the intended
    # failure. Both are regressions.
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Build the starters
        run: |
          cmake -S native/exercises/01-vector-add/starter -B /tmp/starter-01 -G Ninja
          cmake --build /tmp/starter-01
          cmake -S native/exercises/02-reduction/starter -B /tmp/starter-02 -G Ninja
          cmake --build /tmp/starter-02

      - name: Expect starter tests to fail
        run: |
          for build in /tmp/starter-01 /tmp/starter-02; do
            if ctest --test-dir "$build" --output-on-failure; then
              echo "::error::$build passes its tests. It is supposed to fail." >&2
              exit 1
            fi
          done
          echo "Both starter test suites fail, as intended."

# A CUDA compile job is deliberately absent. Compiling the .cu files needs the
# CUDA Toolkit, and running them needs a physical device; neither is available
# on a standard runner. When a GPU runner or an nvcc container is justified, add
# a compile-only job here -- and keep it non-blocking. See docs/roadmap.md.
