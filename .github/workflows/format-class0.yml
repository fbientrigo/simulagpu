name: Format Class 0

on:
  push:
    branches:
      - clase0/mobile-interactive-redesign

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clase0/mobile-interactive-redesign
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          packages/visuals/src/SimuladorIsometricoGPU.css
          packages/visuals/src/SimuladorIsometricoGPU.template.html
      - name: Commit formatted files when needed
        run: |
          if git diff --quiet; then
            echo "Files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/visuals/src/SimuladorIsometricoGPU.css
          git add packages/visuals/src/SimuladorIsometricoGPU.template.html
          git commit -m "style(class-0): format simulator assets"
          git push
